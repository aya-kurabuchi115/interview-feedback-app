<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#E3F2FD"/>
  <circle cx="100" cy="100" r="80" fill="#BBDEFB"/>

  <!-- ESTJ - Dog (イヌ) - 忠実でリーダー気質 -->

  <!-- Tail (wagging) -->
  <path d="M142 140 Q165 118 160 100" fill="none" stroke="#1E88E5" stroke-width="7" stroke-linecap="round"/>
  <path d="M142 140 Q165 118 160 100" fill="none" stroke="#0D47A1" stroke-width="2" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="100" cy="142" rx="44" ry="40" fill="#1E88E5"/>
  <ellipse cx="100" cy="142" rx="44" ry="40" fill="none" stroke="#0D47A1" stroke-width="2"/>

  <!-- Belly -->
  <ellipse cx="100" cy="150" rx="30" ry="28" fill="#E3F2FD"/>

  <!-- Head -->
  <circle cx="100" cy="82" r="38" fill="#1E88E5"/>
  <circle cx="100" cy="82" r="38" fill="none" stroke="#0D47A1" stroke-width="2"/>

  <!-- Floppy ears -->
  <path d="M66 72 Q50 65 42 82 Q38 95 48 100 Q55 100 62 90" fill="#1E88E5" stroke="#0D47A1" stroke-width="2"/>
  <path d="M134 72 Q150 65 158 82 Q162 95 152 100 Q145 100 138 90" fill="#1E88E5" stroke="#0D47A1" stroke-width="2"/>

  <!-- Inner ears -->
  <path d="M62 78 Q52 74 48 86 Q46 94 52 96 Q56 95 60 88" fill="#90CAF9"/>
  <path d="M138 78 Q148 74 152 86 Q154 94 148 96 Q144 95 140 88" fill="#90CAF9"/>

  <!-- Muzzle -->
  <ellipse cx="100" cy="92" rx="18" ry="14" fill="#E3F2FD"/>

  <!-- Eyes (loyal, determined) -->
  <circle cx="85" cy="78" r="10" fill="white" stroke="#0D47A1" stroke-width="1.5"/>
  <circle cx="115" cy="78" r="10" fill="white" stroke="#0D47A1" stroke-width="1.5"/>

  <!-- Pupils -->
  <circle cx="87" cy="77" r="6.5" fill="#0D47A1"/>
  <circle cx="117" cy="77" r="6.5" fill="#0D47A1"/>

  <!-- Eye shine -->
  <circle cx="89" cy="74" r="2.5" fill="white"/>
  <circle cx="119" cy="74" r="2.5" fill="white"/>

  <!-- Determined eyebrows -->
  <path d="M75 68 Q82 65 95 69" fill="none" stroke="#0D47A1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M105 69 Q118 65 125 68" fill="none" stroke="#0D47A1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="100" cy="88" rx="6" ry="5" fill="#0D47A1"/>

  <!-- Mouth (confident smile) -->
  <path d="M93 96 Q100 102 107 96" fill="none" stroke="#0D47A1" stroke-width="2" stroke-linecap="round"/>

  <!-- Tongue (playful touch) -->
  <path d="M100 100 Q102 106 100 110 Q98 106 100 100" fill="#FF8A80"/>

  <!-- Collar with medal (リーダー) -->
  <path d="M68 108 Q100 118 132 108" fill="none" stroke="#F44336" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="118" r="8" fill="#FFD700" stroke="#FFA000" stroke-width="1.5"/>
  <text x="96" y="122" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#F57F17">1</text>

  <!-- Front paws -->
  <ellipse cx="78" cy="175" rx="14" ry="8" fill="#1E88E5" stroke="#0D47A1" stroke-width="1.5"/>
  <ellipse cx="122" cy="175" rx="14" ry="8" fill="#1E88E5" stroke="#0D47A1" stroke-width="1.5"/>

  <!-- Blush -->
  <ellipse cx="72" cy="90" rx="6" ry="4" fill="#F48FB1" opacity="0.4"/>
  <ellipse cx="128" cy="90" rx="6" ry="4" fill="#F48FB1" opacity="0.4"/>
</svg>