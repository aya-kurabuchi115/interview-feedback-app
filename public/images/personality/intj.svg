<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#EDE7F6"/>
  <circle cx="100" cy="100" r="80" fill="#D1C4E9"/>

  <!-- INTJ - Owl (フクロウ) - 知的で戦略的 -->

  <!-- Body -->
  <ellipse cx="100" cy="130" rx="45" ry="50" fill="#9B72CF"/>
  <ellipse cx="100" cy="130" rx="45" ry="50" fill="none" stroke="#7B52AF" stroke-width="2"/>

  <!-- Belly -->
  <ellipse cx="100" cy="140" rx="30" ry="35" fill="#E8DCF5"/>

  <!-- Belly pattern (V shapes) -->
  <path d="M90 125 L95 130 L100 125" fill="none" stroke="#C4A8E0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M100 125 L105 130 L110 125" fill="none" stroke="#C4A8E0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M85 135 L90 140 L95 135" fill="none" stroke="#C4A8E0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M95 135 L100 140 L105 135" fill="none" stroke="#C4A8E0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M105 135 L110 140 L115 135" fill="none" stroke="#C4A8E0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M90 145 L95 150 L100 145" fill="none" stroke="#C4A8E0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M100 145 L105 150 L110 145" fill="none" stroke="#C4A8E0" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="100" cy="82" r="38" fill="#9B72CF"/>
  <circle cx="100" cy="82" r="38" fill="none" stroke="#7B52AF" stroke-width="2"/>

  <!-- Ear tufts -->
  <path d="M68 58 L62 38 L78 52" fill="#9B72CF" stroke="#7B52AF" stroke-width="2" stroke-linejoin="round"/>
  <path d="M132 58 L138 38 L122 52" fill="#9B72CF" stroke="#7B52AF" stroke-width="2" stroke-linejoin="round"/>

  <!-- Eye circles (big round owl eyes) -->
  <circle cx="82" cy="80" r="18" fill="white" stroke="#7B52AF" stroke-width="2"/>
  <circle cx="118" cy="80" r="18" fill="white" stroke="#7B52AF" stroke-width="2"/>

  <!-- Pupils -->
  <circle cx="84" cy="78" r="10" fill="#2D1B4E"/>
  <circle cx="120" cy="78" r="10" fill="#2D1B4E"/>

  <!-- Eye shine -->
  <circle cx="88" cy="74" r="3.5" fill="white"/>
  <circle cx="124" cy="74" r="3.5" fill="white"/>
  <circle cx="82" cy="80" r="1.5" fill="white"/>
  <circle cx="118" cy="80" r="1.5" fill="white"/>

  <!-- Beak -->
  <path d="M95 90 L100 98 L105 90" fill="#FFB74D" stroke="#F09840" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Graduation cap (知的) -->
  <rect x="78" y="50" width="44" height="4" rx="1" fill="#2D1B4E"/>
  <polygon points="100,36 78,50 122,50" fill="#2D1B4E"/>
  <line x1="122" y1="50" x2="128" y2="62" stroke="#2D1B4E" stroke-width="1.5"/>
  <circle cx="128" cy="63" r="2" fill="#FFD700"/>

  <!-- Feet -->
  <path d="M80 175 L75 185 L80 183 L85 185 L90 183 L95 185 L90 175" fill="#FFB74D" stroke="#F09840" stroke-width="1.5"/>
  <path d="M110 175 L105 185 L110 183 L115 185 L120 183 L125 185 L120 175" fill="#FFB74D" stroke="#F09840" stroke-width="1.5"/>

  <!-- Blush -->
  <ellipse cx="70" cy="90" rx="7" ry="4" fill="#E8A0BF" opacity="0.5"/>
  <ellipse cx="130" cy="90" rx="7" ry="4" fill="#E8A0BF" opacity="0.5"/>
</svg>