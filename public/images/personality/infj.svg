<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#E8F5E9"/>
  <circle cx="100" cy="100" r="80" fill="#C8E6C9"/>

  <!-- INFJ - Deer (シカ) - 穏やかで直感的 -->

  <!-- Body -->
  <ellipse cx="100" cy="145" rx="38" ry="38" fill="#66BB6A"/>
  <ellipse cx="100" cy="145" rx="38" ry="38" fill="none" stroke="#43A047" stroke-width="2"/>

  <!-- Belly -->
  <ellipse cx="100" cy="152" rx="25" ry="25" fill="#E8F5E9"/>

  <!-- Belly spots -->
  <circle cx="92" cy="145" r="3" fill="#C8E6C9"/>
  <circle cx="105" cy="140" r="2.5" fill="#C8E6C9"/>
  <circle cx="98" cy="155" r="3" fill="#C8E6C9"/>
  <circle cx="110" cy="152" r="2" fill="#C8E6C9"/>

  <!-- Head -->
  <ellipse cx="100" cy="82" rx="34" ry="32" fill="#66BB6A"/>
  <ellipse cx="100" cy="82" rx="34" ry="32" fill="none" stroke="#43A047" stroke-width="2"/>

  <!-- Antlers (小さくかわいい角) -->
  <g stroke="#8D6E63" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M78 58 L72 38 M72 38 L65 30 M72 38 L78 28"/>
    <path d="M122 58 L128 38 M128 38 L135 30 M128 38 L122 28"/>
  </g>

  <!-- Ears -->
  <ellipse cx="68" cy="68" rx="14" ry="8" fill="#66BB6A" stroke="#43A047" stroke-width="1.5" transform="rotate(-30 68 68)"/>
  <ellipse cx="132" cy="68" rx="14" ry="8" fill="#66BB6A" stroke="#43A047" stroke-width="1.5" transform="rotate(30 132 68)"/>

  <!-- Inner ears -->
  <ellipse cx="68" cy="68" rx="9" ry="5" fill="#A5D6A7" transform="rotate(-30 68 68)"/>
  <ellipse cx="132" cy="68" rx="9" ry="5" fill="#A5D6A7" transform="rotate(30 132 68)"/>

  <!-- Eyes (gentle, kind eyes) -->
  <circle cx="86" cy="80" r="10" fill="white" stroke="#43A047" stroke-width="1.5"/>
  <circle cx="114" cy="80" r="10" fill="white" stroke="#43A047" stroke-width="1.5"/>

  <!-- Pupils (soft look) -->
  <circle cx="87" cy="79" r="6.5" fill="#1B5E20"/>
  <circle cx="115" cy="79" r="6.5" fill="#1B5E20"/>

  <!-- Eye shine -->
  <circle cx="90" cy="76" r="2.5" fill="white"/>
  <circle cx="118" cy="76" r="2.5" fill="white"/>
  <circle cx="85" cy="81" r="1.5" fill="white"/>
  <circle cx="113" cy="81" r="1.5" fill="white"/>

  <!-- Gentle eyelashes -->
  <path d="M76 76 L73 73" stroke="#43A047" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M124 76 L127 73" stroke="#43A047" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="100" cy="92" rx="5" ry="3.5" fill="#2E7D32"/>

  <!-- Mouth (gentle smile) -->
  <path d="M95 97 Q100 101 105 97" fill="none" stroke="#43A047" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Small flower (穏やか) -->
  <g transform="translate(138, 55)">
    <circle cx="0" cy="0" r="5" fill="#FFECB3"/>
    <circle cx="5" cy="-3" r="5" fill="#FFECB3"/>
    <circle cx="5" cy="3" r="5" fill="#FFECB3"/>
    <circle cx="-5" cy="-3" r="5" fill="#FFECB3"/>
    <circle cx="-5" cy="3" r="5" fill="#FFECB3"/>
    <circle cx="0" cy="0" r="3" fill="#FFD54F"/>
  </g>

  <!-- Legs -->
  <rect x="78" y="170" width="10" height="16" rx="5" fill="#66BB6A" stroke="#43A047" stroke-width="1.5"/>
  <rect x="112" y="170" width="10" height="16" rx="5" fill="#66BB6A" stroke="#43A047" stroke-width="1.5"/>

  <!-- Hooves -->
  <rect x="78" y="182" width="10" height="5" rx="3" fill="#8D6E63"/>
  <rect x="112" y="182" width="10" height="5" rx="3" fill="#8D6E63"/>

  <!-- Blush -->
  <ellipse cx="74" cy="88" rx="6" ry="4" fill="#F48FB1" opacity="0.4"/>
  <ellipse cx="126" cy="88" rx="6" ry="4" fill="#F48FB1" opacity="0.4"/>
</svg>