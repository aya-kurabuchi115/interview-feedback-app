<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#FBE9E7"/>
  <circle cx="100" cy="100" r="80" fill="#FFCCBC"/>

  <!-- ESTP - Cheetah (チーター) - 大胆で行動的 -->

  <!-- Body -->
  <ellipse cx="100" cy="142" rx="42" ry="40" fill="#F4511E"/>
  <ellipse cx="100" cy="142" rx="42" ry="40" fill="none" stroke="#D84315" stroke-width="2"/>

  <!-- Belly -->
  <ellipse cx="100" cy="150" rx="28" ry="28" fill="#FBE9E7"/>

  <!-- Spots on body -->
  <circle cx="72" cy="132" r="4" fill="#BF360C" opacity="0.5"/>
  <circle cx="130" cy="128" r="3.5" fill="#BF360C" opacity="0.5"/>
  <circle cx="80" cy="150" r="3" fill="#BF360C" opacity="0.5"/>
  <circle cx="118" cy="148" r="3.5" fill="#BF360C" opacity="0.5"/>

  <!-- Head -->
  <circle cx="100" cy="80" r="38" fill="#F4511E"/>
  <circle cx="100" cy="80" r="38" fill="none" stroke="#D84315" stroke-width="2"/>

  <!-- Ears -->
  <path d="M68 58 L60 35 L82 50" fill="#F4511E" stroke="#D84315" stroke-width="2" stroke-linejoin="round"/>
  <path d="M132 58 L140 35 L118 50" fill="#F4511E" stroke="#D84315" stroke-width="2" stroke-linejoin="round"/>

  <!-- Inner ears -->
  <path d="M70 55 L65 40 L80 51" fill="#FFAB91"/>
  <path d="M130 55 L135 40 L120 51" fill="#FFAB91"/>

  <!-- Head spots -->
  <circle cx="75" cy="65" r="3.5" fill="#BF360C" opacity="0.5"/>
  <circle cx="125" cy="65" r="3" fill="#BF360C" opacity="0.5"/>
  <circle cx="90" cy="58" r="2.5" fill="#BF360C" opacity="0.5"/>
  <circle cx="112" cy="60" r="3" fill="#BF360C" opacity="0.5"/>

  <!-- Tear marks (チーター特有) -->
  <path d="M82 82 Q80 92 78 102" fill="none" stroke="#2D1B0E" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M118 82 Q120 92 122 102" fill="none" stroke="#2D1B0E" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes (bold, energetic) -->
  <circle cx="86" cy="76" r="11" fill="white" stroke="#D84315" stroke-width="1.5"/>
  <circle cx="114" cy="76" r="11" fill="white" stroke="#D84315" stroke-width="1.5"/>

  <!-- Pupils (sharp and focused) -->
  <circle cx="88" cy="75" r="7" fill="#BF360C"/>
  <circle cx="116" cy="75" r="7" fill="#BF360C"/>

  <!-- Eye shine -->
  <circle cx="91" cy="72" r="3" fill="white"/>
  <circle cx="119" cy="72" r="3" fill="white"/>

  <!-- Bold eyebrows -->
  <path d="M75 64 Q82 60 97 65" fill="none" stroke="#BF360C" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M103 65 Q118 60 125 64" fill="none" stroke="#BF360C" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M96 86 L100 90 L104 86 Z" fill="#2D1B0E"/>

  <!-- Mouth (confident grin) -->
  <path d="M92 94 Q100 100 108 94" fill="none" stroke="#D84315" stroke-width="2" stroke-linecap="round"/>

  <!-- Speed lines (行動的) -->
  <line x1="35" y1="75" x2="50" y2="75" stroke="#FFB74D" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="30" y1="85" x2="48" y2="85" stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="32" y1="95" x2="46" y2="95" stroke="#FFB74D" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Tail -->
  <path d="M142 140 Q168 130 172 110 Q175 95 165 92" fill="none" stroke="#F4511E" stroke-width="7" stroke-linecap="round"/>
  <path d="M172 110 Q175 95 165 92" fill="none" stroke="#2D1B0E" stroke-width="7" stroke-linecap="round"/>

  <!-- Front paws (running pose) -->
  <ellipse cx="76" cy="175" rx="13" ry="7" fill="#F4511E" stroke="#D84315" stroke-width="1.5"/>
  <ellipse cx="124" cy="175" rx="13" ry="7" fill="#F4511E" stroke="#D84315" stroke-width="1.5"/>

  <!-- Blush -->
  <ellipse cx="72" cy="88" rx="5" ry="3" fill="#F48FB1" opacity="0.4"/>
  <ellipse cx="128" cy="88" rx="5" ry="3" fill="#F48FB1" opacity="0.4"/>
</svg>