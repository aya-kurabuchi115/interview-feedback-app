<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#E3F2FD"/>
  <circle cx="100" cy="100" r="80" fill="#BBDEFB"/>

  <!-- ISTJ - Bear (クマ) - 真面目で信頼できる -->

  <!-- Body -->
  <ellipse cx="100" cy="145" rx="45" ry="42" fill="#42A5F5"/>
  <ellipse cx="100" cy="145" rx="45" ry="42" fill="none" stroke="#1E88E5" stroke-width="2"/>

  <!-- Belly -->
  <ellipse cx="100" cy="150" rx="30" ry="30" fill="#E3F2FD"/>

  <!-- Head -->
  <circle cx="100" cy="85" r="40" fill="#42A5F5"/>
  <circle cx="100" cy="85" r="40" fill="none" stroke="#1E88E5" stroke-width="2"/>

  <!-- Round ears -->
  <circle cx="68" cy="55" r="15" fill="#42A5F5" stroke="#1E88E5" stroke-width="2"/>
  <circle cx="132" cy="55" r="15" fill="#42A5F5" stroke="#1E88E5" stroke-width="2"/>

  <!-- Inner ears -->
  <circle cx="68" cy="55" r="9" fill="#90CAF9"/>
  <circle cx="132" cy="55" r="9" fill="#90CAF9"/>

  <!-- Muzzle -->
  <ellipse cx="100" cy="93" rx="18" ry="14" fill="#E3F2FD"/>

  <!-- Eyes (serious but kind) -->
  <circle cx="84" cy="82" r="10" fill="white" stroke="#1E88E5" stroke-width="1.5"/>
  <circle cx="116" cy="82" r="10" fill="white" stroke="#1E88E5" stroke-width="1.5"/>

  <!-- Pupils -->
  <circle cx="86" cy="81" r="6" fill="#0D47A1"/>
  <circle cx="118" cy="81" r="6" fill="#0D47A1"/>

  <!-- Eye shine -->
  <circle cx="88" cy="78" r="2.5" fill="white"/>
  <circle cx="120" cy="78" r="2.5" fill="white"/>

  <!-- Slight serious brow -->
  <path d="M74 74 Q80 72 94 75" fill="none" stroke="#1E88E5" stroke-width="2" stroke-linecap="round"/>
  <path d="M106 75 Q120 72 126 74" fill="none" stroke="#1E88E5" stroke-width="2" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="100" cy="90" rx="6" ry="4.5" fill="#0D47A1"/>

  <!-- Mouth (slight reserved smile) -->
  <path d="M95 97 Q100 100 105 97" fill="none" stroke="#1E88E5" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Glasses (真面目) -->
  <circle cx="84" cy="82" r="14" fill="none" stroke="#0D47A1" stroke-width="2"/>
  <circle cx="116" cy="82" r="14" fill="none" stroke="#0D47A1" stroke-width="2"/>
  <line x1="98" y1="82" x2="102" y2="82" stroke="#0D47A1" stroke-width="2"/>
  <line x1="70" y1="80" x2="64" y2="76" stroke="#0D47A1" stroke-width="2" stroke-linecap="round"/>
  <line x1="130" y1="80" x2="136" y2="76" stroke="#0D47A1" stroke-width="2" stroke-linecap="round"/>

  <!-- Clipboard (管理者) -->
  <g transform="translate(140, 120) rotate(15)">
    <rect x="0" y="0" width="20" height="28" rx="2" fill="#FFE082" stroke="#FFC107" stroke-width="1.5"/>
    <rect x="6" y="-3" width="8" height="6" rx="2" fill="#FFC107" stroke="#F9A825" stroke-width="1"/>
    <line x1="4" y1="10" x2="16" y2="10" stroke="#BCAAA4" stroke-width="1.5"/>
    <line x1="4" y1="15" x2="16" y2="15" stroke="#BCAAA4" stroke-width="1.5"/>
    <line x1="4" y1="20" x2="12" y2="20" stroke="#BCAAA4" stroke-width="1.5"/>
  </g>

  <!-- Front paws -->
  <ellipse cx="78" cy="178" rx="14" ry="8" fill="#42A5F5" stroke="#1E88E5" stroke-width="1.5"/>
  <ellipse cx="122" cy="178" rx="14" ry="8" fill="#42A5F5" stroke="#1E88E5" stroke-width="1.5"/>

  <!-- Paw pads -->
  <circle cx="74" cy="179" r="3" fill="#90CAF9"/>
  <circle cx="82" cy="179" r="3" fill="#90CAF9"/>
  <circle cx="78" cy="174" r="3" fill="#90CAF9"/>
  <circle cx="118" cy="179" r="3" fill="#90CAF9"/>
  <circle cx="126" cy="179" r="3" fill="#90CAF9"/>
  <circle cx="122" cy="174" r="3" fill="#90CAF9"/>

  <!-- Blush -->
  <ellipse cx="72" cy="92" rx="6" ry="4" fill="#F48FB1" opacity="0.4"/>
  <ellipse cx="128" cy="92" rx="6" ry="4" fill="#F48FB1" opacity="0.4"/>
</svg>