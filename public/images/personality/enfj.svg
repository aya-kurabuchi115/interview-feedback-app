<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#E8F5E9"/>
  <circle cx="100" cy="100" r="80" fill="#C8E6C9"/>

  <!-- ENFJ - Dolphin (イルカ) - カリスマ性 -->

  <!-- Water splash effect -->
  <ellipse cx="100" cy="160" rx="55" ry="18" fill="#B2DFDB" opacity="0.5"/>

  <!-- Body (curved dolphin shape) -->
  <path d="M60 120 Q55 90 75 70 Q90 55 110 60 Q135 65 145 90 Q150 105 145 125 Q138 145 120 155 Q100 162 80 155 Q62 145 60 120 Z" fill="#4CAF50"/>
  <path d="M60 120 Q55 90 75 70 Q90 55 110 60 Q135 65 145 90 Q150 105 145 125 Q138 145 120 155 Q100 162 80 155 Q62 145 60 120 Z" fill="none" stroke="#388E3C" stroke-width="2"/>

  <!-- Belly -->
  <path d="M72 110 Q70 95 82 82 Q92 72 108 76 Q125 80 132 98 Q135 110 130 125 Q125 138 112 143 Q98 148 86 143 Q74 135 72 110 Z" fill="#E8F5E9"/>

  <!-- Dorsal fin -->
  <path d="M105 62 L115 35 L120 65" fill="#4CAF50" stroke="#388E3C" stroke-width="2" stroke-linejoin="round"/>

  <!-- Tail fin -->
  <path d="M62 135 L38 128 L45 140 L35 148 L60 145" fill="#4CAF50" stroke="#388E3C" stroke-width="2" stroke-linejoin="round"/>

  <!-- Flipper -->
  <path d="M78 120 L60 138 L82 132" fill="#4CAF50" stroke="#388E3C" stroke-width="2" stroke-linejoin="round"/>

  <!-- Snout (beak shape) -->
  <path d="M135 90 Q155 88 158 95 Q155 100 135 100" fill="#4CAF50" stroke="#388E3C" stroke-width="2"/>
  <path d="M135 90 Q155 88 158 95 Q155 100 135 100" fill="none" stroke="#388E3C" stroke-width="1"/>

  <!-- Eye -->
  <circle cx="128" cy="84" r="10" fill="white" stroke="#388E3C" stroke-width="1.5"/>
  <circle cx="130" cy="83" r="6" fill="#1B5E20"/>
  <circle cx="132" cy="80" r="2.5" fill="white"/>
  <circle cx="128" cy="84" r="1.5" fill="white"/>

  <!-- Happy mouth -->
  <path d="M140 98 Q150 102 156 97" fill="none" stroke="#388E3C" stroke-width="2" stroke-linecap="round"/>

  <!-- Sparkles (カリスマ性) -->
  <g fill="#FFD700" opacity="0.7">
    <polygon points="50,50 52,45 54,50 59,50 55,53 57,58 52,55 47,58 49,53 45,50" />
    <polygon points="155,55 157,50 159,55 164,55 160,58 162,63 157,60 152,63 154,58 150,55" />
    <polygon points="160,125 162,121 164,125 168,125 165,128 166,132 162,129 158,132 159,128 156,125" />
  </g>

  <!-- Water drops -->
  <ellipse cx="45" cy="155" rx="4" ry="6" fill="#B2DFDB" opacity="0.6"/>
  <ellipse cx="155" cy="148" rx="3" ry="5" fill="#B2DFDB" opacity="0.6"/>
  <ellipse cx="60" cy="162" rx="3" ry="4" fill="#B2DFDB" opacity="0.5"/>

  <!-- Blush -->
  <ellipse cx="138" cy="92" rx="5" ry="3" fill="#F48FB1" opacity="0.4"/>
</svg>