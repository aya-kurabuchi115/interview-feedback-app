<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#EDE7F6"/>
  <circle cx="100" cy="100" r="80" fill="#D1C4E9"/>

  <!-- INTP - Cat (ネコ) - 好奇心旺盛で独立心 -->

  <!-- Tail -->
  <path d="M140 150 Q170 130 165 100 Q162 85 155 90" fill="none" stroke="#A78BDA" stroke-width="8" stroke-linecap="round"/>
  <path d="M140 150 Q170 130 165 100 Q162 85 155 90" fill="none" stroke="#8B6BC0" stroke-width="2" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="100" cy="140" rx="42" ry="40" fill="#A78BDA"/>
  <ellipse cx="100" cy="140" rx="42" ry="40" fill="none" stroke="#8B6BC0" stroke-width="2"/>

  <!-- Belly -->
  <ellipse cx="100" cy="148" rx="28" ry="28" fill="#EDE7F6"/>

  <!-- Head -->
  <circle cx="100" cy="85" r="38" fill="#A78BDA"/>
  <circle cx="100" cy="85" r="38" fill="none" stroke="#8B6BC0" stroke-width="2"/>

  <!-- Ears -->
  <path d="M68 65 L58 35 L82 55" fill="#A78BDA" stroke="#8B6BC0" stroke-width="2" stroke-linejoin="round"/>
  <path d="M132 65 L142 35 L118 55" fill="#A78BDA" stroke="#8B6BC0" stroke-width="2" stroke-linejoin="round"/>

  <!-- Inner ears -->
  <path d="M70 62 L63 42 L80 57" fill="#D4BEF0"/>
  <path d="M130 62 L137 42 L120 57" fill="#D4BEF0"/>

  <!-- Eyes (big curious eyes) -->
  <circle cx="84" cy="82" r="13" fill="white" stroke="#8B6BC0" stroke-width="1.5"/>
  <circle cx="116" cy="82" r="13" fill="white" stroke="#8B6BC0" stroke-width="1.5"/>

  <!-- Pupils (looking up - curious) -->
  <circle cx="86" cy="78" r="8" fill="#2D1B4E"/>
  <circle cx="118" cy="78" r="8" fill="#2D1B4E"/>

  <!-- Eye shine -->
  <circle cx="89" cy="75" r="3" fill="white"/>
  <circle cx="121" cy="75" r="3" fill="white"/>
  <circle cx="84" cy="80" r="1.5" fill="white"/>
  <circle cx="116" cy="80" r="1.5" fill="white"/>

  <!-- Nose -->
  <path d="M97 92 L100 96 L103 92 Z" fill="#FF8A9B"/>

  <!-- Mouth -->
  <path d="M100 96 Q95 101 92 99" fill="none" stroke="#8B6BC0" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M100 96 Q105 101 108 99" fill="none" stroke="#8B6BC0" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="60" y1="88" x2="80" y2="92" stroke="#8B6BC0" stroke-width="1" opacity="0.6"/>
  <line x1="58" y1="95" x2="79" y2="96" stroke="#8B6BC0" stroke-width="1" opacity="0.6"/>
  <line x1="120" y1="92" x2="140" y2="88" stroke="#8B6BC0" stroke-width="1" opacity="0.6"/>
  <line x1="121" y1="96" x2="142" y2="95" stroke="#8B6BC0" stroke-width="1" opacity="0.6"/>

  <!-- Question mark (好奇心) -->
  <text x="140" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#7E57C2" opacity="0.7">?</text>

  <!-- Front paws -->
  <ellipse cx="78" cy="172" rx="12" ry="8" fill="#A78BDA" stroke="#8B6BC0" stroke-width="1.5"/>
  <ellipse cx="122" cy="172" rx="12" ry="8" fill="#A78BDA" stroke="#8B6BC0" stroke-width="1.5"/>

  <!-- Paw pads -->
  <circle cx="75" cy="173" r="2.5" fill="#D4BEF0"/>
  <circle cx="81" cy="173" r="2.5" fill="#D4BEF0"/>
  <circle cx="78" cy="169" r="2.5" fill="#D4BEF0"/>
  <circle cx="119" cy="173" r="2.5" fill="#D4BEF0"/>
  <circle cx="125" cy="173" r="2.5" fill="#D4BEF0"/>
  <circle cx="122" cy="169" r="2.5" fill="#D4BEF0"/>

  <!-- Blush -->
  <ellipse cx="72" cy="93" rx="6" ry="4" fill="#E8A0BF" opacity="0.5"/>
  <ellipse cx="128" cy="93" rx="6" ry="4" fill="#E8A0BF" opacity="0.5"/>
</svg>