<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#FBE9E7"/>
  <circle cx="100" cy="100" r="80" fill="#FFCCBC"/>

  <!-- ISTP - Hawk (タカ) - 冷静で器用 -->

  <!-- Body -->
  <ellipse cx="100" cy="138" rx="38" ry="45" fill="#FF7043"/>
  <ellipse cx="100" cy="138" rx="38" ry="45" fill="none" stroke="#E64A19" stroke-width="2"/>

  <!-- Belly feathers -->
  <ellipse cx="100" cy="145" rx="26" ry="32" fill="#FBE9E7"/>

  <!-- Belly feather pattern -->
  <path d="M88 130 L92 135 L96 130" fill="none" stroke="#FFCCBC" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M96 130 L100 135 L104 130" fill="none" stroke="#FFCCBC" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M104 130 L108 135 L112 130" fill="none" stroke="#FFCCBC" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M90 140 L94 145 L98 140" fill="none" stroke="#FFCCBC" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M98 140 L102 145 L106 140" fill="none" stroke="#FFCCBC" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wings (folded) -->
  <path d="M60 115 Q50 130 52 155 Q54 165 62 162 L70 140" fill="#E64A19" stroke="#BF360C" stroke-width="1.5"/>
  <path d="M140 115 Q150 130 148 155 Q146 165 138 162 L130 140" fill="#E64A19" stroke="#BF360C" stroke-width="1.5"/>

  <!-- Wing feather details -->
  <line x1="55" y1="140" x2="62" y2="138" stroke="#BF360C" stroke-width="1" opacity="0.5"/>
  <line x1="54" y1="150" x2="63" y2="147" stroke="#BF360C" stroke-width="1" opacity="0.5"/>
  <line x1="145" y1="140" x2="138" y2="138" stroke="#BF360C" stroke-width="1" opacity="0.5"/>
  <line x1="146" y1="150" x2="137" y2="147" stroke="#BF360C" stroke-width="1" opacity="0.5"/>

  <!-- Head -->
  <circle cx="100" cy="78" r="35" fill="#FF7043"/>
  <circle cx="100" cy="78" r="35" fill="none" stroke="#E64A19" stroke-width="2"/>

  <!-- Head feather tuft -->
  <path d="M95 45 Q98 35 100 44 Q102 35 105 45" fill="#E64A19" stroke="#BF360C" stroke-width="1.5"/>

  <!-- Brow ridge (sharp, focused) -->
  <path d="M72 68 Q85 62 98 70" fill="none" stroke="#BF360C" stroke-width="3" stroke-linecap="round"/>
  <path d="M102 70 Q115 62 128 68" fill="none" stroke="#BF360C" stroke-width="3" stroke-linecap="round"/>

  <!-- Eyes (sharp, focused) -->
  <circle cx="86" cy="76" r="10" fill="white" stroke="#E64A19" stroke-width="1.5"/>
  <circle cx="114" cy="76" r="10" fill="white" stroke="#E64A19" stroke-width="1.5"/>

  <!-- Pupils (sharp, intense) -->
  <circle cx="88" cy="75" r="6" fill="#BF360C"/>
  <circle cx="116" cy="75" r="6" fill="#BF360C"/>

  <!-- Eye shine -->
  <circle cx="90" cy="72" r="2.5" fill="white"/>
  <circle cx="118" cy="72" r="2.5" fill="white"/>

  <!-- Beak (sharp, curved) -->
  <path d="M94 86 L100 98 L106 86 Q100 90 94 86 Z" fill="#FFB74D" stroke="#F09840" stroke-width="1.5"/>
  <path d="M100 90 L100 94" stroke="#F09840" stroke-width="1"/>

  <!-- Wrench (器用) -->
  <g transform="translate(145, 55) rotate(30)">
    <rect x="-2" y="0" width="4" height="22" rx="1" fill="#9E9E9E" stroke="#757575" stroke-width="1"/>
    <path d="M-5 0 Q-5 -5 0 -5 Q5 -5 5 0 L3 2 L-3 2 Z" fill="#9E9E9E" stroke="#757575" stroke-width="1"/>
  </g>

  <!-- Feet/Talons -->
  <g fill="#FFB74D" stroke="#F09840" stroke-width="1.5">
    <path d="M82 178 L76 186 L80 183 L84 186 L88 183 L92 186 L88 178"/>
    <path d="M108 178 L102 186 L106 183 L110 186 L114 183 L118 186 L114 178"/>
  </g>

  <!-- Blush -->
  <ellipse cx="74" cy="84" rx="5" ry="3" fill="#F48FB1" opacity="0.4"/>
  <ellipse cx="126" cy="84" rx="5" ry="3" fill="#F48FB1" opacity="0.4"/>
</svg>