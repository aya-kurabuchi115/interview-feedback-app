<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#FBE9E7"/>
  <circle cx="100" cy="100" r="80" fill="#FFCCBC"/>

  <!-- ISFP - Butterfly (チョウ) - 自由で芸術的 -->

  <!-- Upper wings -->
  <path d="M100 90 Q60 40 35 65 Q15 90 45 105 Q65 112 100 95" fill="#FFAB91" stroke="#FF8A65" stroke-width="2"/>
  <path d="M100 90 Q140 40 165 65 Q185 90 155 105 Q135 112 100 95" fill="#FFAB91" stroke="#FF8A65" stroke-width="2"/>

  <!-- Lower wings -->
  <path d="M100 100 Q55 115 45 140 Q38 162 65 158 Q85 152 100 120" fill="#FFAB91" stroke="#FF8A65" stroke-width="2"/>
  <path d="M100 100 Q145 115 155 140 Q162 162 135 158 Q115 152 100 120" fill="#FFAB91" stroke="#FF8A65" stroke-width="2"/>

  <!-- Wing patterns (artistic) -->
  <circle cx="60" cy="78" r="14" fill="#FF8A65" opacity="0.5"/>
  <circle cx="140" cy="78" r="14" fill="#FF8A65" opacity="0.5"/>
  <circle cx="60" cy="78" r="8" fill="#FBE9E7" opacity="0.6"/>
  <circle cx="140" cy="78" r="8" fill="#FBE9E7" opacity="0.6"/>

  <circle cx="50" cy="95" r="8" fill="#FFD54F" opacity="0.4"/>
  <circle cx="150" cy="95" r="8" fill="#FFD54F" opacity="0.4"/>

  <circle cx="65" cy="138" r="10" fill="#FF8A65" opacity="0.5"/>
  <circle cx="135" cy="138" r="10" fill="#FF8A65" opacity="0.5"/>
  <circle cx="65" cy="138" r="5" fill="#FBE9E7" opacity="0.6"/>
  <circle cx="135" cy="138" r="5" fill="#FBE9E7" opacity="0.6"/>

  <!-- Wing edge sparkles -->
  <circle cx="40" cy="70" r="2" fill="#FFD54F" opacity="0.6"/>
  <circle cx="160" cy="70" r="2" fill="#FFD54F" opacity="0.6"/>
  <circle cx="50" cy="150" r="2" fill="#FFD54F" opacity="0.6"/>
  <circle cx="150" cy="150" r="2" fill="#FFD54F" opacity="0.6"/>

  <!-- Body -->
  <ellipse cx="100" cy="105" rx="10" ry="25" fill="#E64A19"/>
  <ellipse cx="100" cy="105" rx="10" ry="25" fill="none" stroke="#BF360C" stroke-width="1.5"/>

  <!-- Head -->
  <circle cx="100" cy="75" r="18" fill="#FFAB91"/>
  <circle cx="100" cy="75" r="18" fill="none" stroke="#FF8A65" stroke-width="2"/>

  <!-- Antennae -->
  <path d="M92 60 Q85 40 78 35" fill="none" stroke="#E64A19" stroke-width="2" stroke-linecap="round"/>
  <path d="M108 60 Q115 40 122 35" fill="none" stroke="#E64A19" stroke-width="2" stroke-linecap="round"/>
  <circle cx="78" cy="35" r="4" fill="#FFD54F"/>
  <circle cx="122" cy="35" r="4" fill="#FFD54F"/>

  <!-- Eyes (dreamy, artistic) -->
  <circle cx="94" cy="73" r="7" fill="white" stroke="#FF8A65" stroke-width="1.5"/>
  <circle cx="106" cy="73" r="7" fill="white" stroke="#FF8A65" stroke-width="1.5"/>

  <!-- Pupils -->
  <circle cx="95" cy="72" r="4.5" fill="#BF360C"/>
  <circle cx="107" cy="72" r="4.5" fill="#BF360C"/>

  <!-- Eye shine -->
  <circle cx="97" cy="70" r="2" fill="white"/>
  <circle cx="109" cy="70" r="2" fill="white"/>

  <!-- Gentle eyelashes -->
  <path d="M87 70 L85 67" stroke="#FF8A65" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M113 70 L115 67" stroke="#FF8A65" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Mouth (serene smile) -->
  <path d="M97 80 Q100 83 103 80" fill="none" stroke="#E64A19" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Paint palette (芸術的) -->
  <g transform="translate(150, 165)">
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="#FFE082" stroke="#FFC107" stroke-width="1"/>
    <circle cx="-5" cy="-3" r="2.5" fill="#EF5350"/>
    <circle cx="2" cy="-4" r="2.5" fill="#42A5F5"/>
    <circle cx="7" cy="-1" r="2.5" fill="#66BB6A"/>
    <circle cx="-2" cy="3" r="2.5" fill="#AB47BC"/>
    <circle cx="-8" cy="2" r="3" fill="#FBE9E7"/>
  </g>

  <!-- Blush -->
  <ellipse cx="86" cy="78" rx="4" ry="3" fill="#F48FB1" opacity="0.5"/>
  <ellipse cx="114" cy="78" rx="4" ry="3" fill="#F48FB1" opacity="0.5"/>
</svg>