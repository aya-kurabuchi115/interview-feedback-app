<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="#E8F5E9"/>
  <circle cx="100" cy="100" r="80" fill="#C8E6C9"/>

  <!-- INFP - Rabbit (ウサギ) - 優しくて理想主義 -->

  <!-- Body -->
  <ellipse cx="100" cy="145" rx="40" ry="40" fill="#81C784"/>
  <ellipse cx="100" cy="145" rx="40" ry="40" fill="none" stroke="#66BB6A" stroke-width="2"/>

  <!-- Belly -->
  <ellipse cx="100" cy="152" rx="28" ry="28" fill="#E8F5E9"/>

  <!-- Head -->
  <circle cx="100" cy="88" r="36" fill="#81C784"/>
  <circle cx="100" cy="88" r="36" fill="none" stroke="#66BB6A" stroke-width="2"/>

  <!-- Long ears -->
  <ellipse cx="80" cy="42" rx="12" ry="32" fill="#81C784" stroke="#66BB6A" stroke-width="2"/>
  <ellipse cx="120" cy="42" rx="12" ry="32" fill="#81C784" stroke="#66BB6A" stroke-width="2"/>

  <!-- Inner ears -->
  <ellipse cx="80" cy="42" rx="7" ry="24" fill="#F8BBD0"/>
  <ellipse cx="120" cy="42" rx="7" ry="24" fill="#F8BBD0"/>

  <!-- Eyes (dreamy, big eyes) -->
  <circle cx="86" cy="85" r="12" fill="white" stroke="#66BB6A" stroke-width="1.5"/>
  <circle cx="114" cy="85" r="12" fill="white" stroke="#66BB6A" stroke-width="1.5"/>

  <!-- Pupils (sparkly dreamy eyes) -->
  <circle cx="88" cy="83" r="7.5" fill="#1B5E20"/>
  <circle cx="116" cy="83" r="7.5" fill="#1B5E20"/>

  <!-- Eye shine (extra sparkly for dreamy look) -->
  <circle cx="91" cy="80" r="3" fill="white"/>
  <circle cx="119" cy="80" r="3" fill="white"/>
  <circle cx="85" cy="85" r="2" fill="white"/>
  <circle cx="113" cy="85" r="2" fill="white"/>
  <circle cx="90" cy="87" r="1" fill="white"/>
  <circle cx="118" cy="87" r="1" fill="white"/>

  <!-- Nose (bunny nose) -->
  <ellipse cx="100" cy="96" rx="4" ry="3" fill="#F48FB1"/>

  <!-- Mouth -->
  <path d="M100 99 L96 103" fill="none" stroke="#66BB6A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M100 99 L104 103" fill="none" stroke="#66BB6A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Hearts floating (理想主義) -->
  <path d="M145 50 Q145 44 140 44 Q135 44 135 50 Q135 55 145 60 Q155 55 155 50 Q155 44 150 44 Q145 44 145 50 Z" fill="#F48FB1" opacity="0.6"/>
  <path d="M155 70 Q155 66 152 66 Q149 66 149 70 Q149 73 155 76 Q161 73 161 70 Q161 66 158 66 Q155 66 155 70 Z" fill="#F48FB1" opacity="0.4"/>
  <path d="M50 55 Q50 51 47 51 Q44 51 44 55 Q44 58 50 61 Q56 58 56 55 Q56 51 53 51 Q50 51 50 55 Z" fill="#F48FB1" opacity="0.35"/>

  <!-- Fluffy cheeks -->
  <circle cx="68" cy="92" r="8" fill="#A5D6A7" opacity="0.5"/>
  <circle cx="132" cy="92" r="8" fill="#A5D6A7" opacity="0.5"/>

  <!-- Front paws -->
  <ellipse cx="80" cy="175" rx="12" ry="8" fill="#81C784" stroke="#66BB6A" stroke-width="1.5"/>
  <ellipse cx="120" cy="175" rx="12" ry="8" fill="#81C784" stroke="#66BB6A" stroke-width="1.5"/>

  <!-- Bunny tail (little cotton ball visible from behind) -->
  <circle cx="140" cy="158" r="8" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1"/>

  <!-- Blush -->
  <ellipse cx="74" cy="94" rx="7" ry="4" fill="#F48FB1" opacity="0.4"/>
  <ellipse cx="126" cy="94" rx="7" ry="4" fill="#F48FB1" opacity="0.4"/>
</svg>